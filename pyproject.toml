[project]
name = "adanvil"
version = "0.3.1"
description = "Agentic video ad editor: an MCP server that turns your brand's footage into ready-to-run 9:16 ads."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "maxbuildog" }]
keywords = ["mcp", "video", "video-ads", "ffmpeg", "ai-agents", "ugc", "captions", "9:16"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7",
    "Pillow>=10.3",
    "PyYAML>=6.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<2"]

[project.urls]
Homepage = "https://github.com/maxbuildog/adanvil"
Issues = "https://github.com/maxbuildog/adanvil/issues"

[project.scripts]
adanvil = "adanvil.cli:main"
adanvil-mcp = "adanvil.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adanvil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
