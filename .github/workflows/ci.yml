name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Runs on every push and pull request of the public repository; elsewhere (forks,
    # private mirrors) only when started by hand, to spare their Actions minutes.
    if: github.repository == 'maxbuildog/adanvil' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Show ffmpeg version
        run: ffmpeg -version | head -1
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  package:
    if: github.repository == 'maxbuildog/adanvil' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Build the Claude Desktop extension
        run: |
          uv run python scripts/build_mcpb.py --check
          uv run python scripts/build_mcpb.py
          ls -l dist/*.mcpb
      - name: Build the Docker image (not pushed)
        run: docker build -t adanvil:ci .
      - name: Docker image lists the tools
        run: uv run pytest tests/test_packaging.py -q
