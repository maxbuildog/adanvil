name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      index:
        description: "testpypi or pypi"
        default: "testpypi"

permissions: {}

jobs:
  publish:
    if: github.repository == 'maxbuildog/adanvil'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv build
      - if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
      - if: github.event_name == 'release' || inputs.index == 'pypi'
        run: uv publish --trusted-publishing always
