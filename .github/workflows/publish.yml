name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      index:
        description: "testpypi or pypi"
        default: "testpypi"
jobs:
  publish:
    if: github.repository == 'maxbuildog/adanvil'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
      - if: github.event_name == 'release' || inputs.index == 'pypi'
        run: uv publish --trusted-publishing always
